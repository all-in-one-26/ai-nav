app = 'ai-nav'
primary_region = 'hkg'

[build]

[env]
  TZ = 'Asia/Shanghai'

[http_service]
  internal_port = 6412
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = 'data'
  destination = '/app/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
